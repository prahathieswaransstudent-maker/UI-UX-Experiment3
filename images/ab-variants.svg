<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Original and improved shopping app variants</title>
  <desc id="desc">Side-by-side visual comparison showing the original dense marketplace design and improved clear search and consistent cart actions.</desc>
  <rect width="1200" height="500" rx="22" fill="#f4f6fa"/>
  <text x="48" y="57" fill="#19212f" font-family="Arial,sans-serif" font-size="26" font-weight="700">A/B design comparison</text>
  <text x="48" y="84" fill="#667085" font-family="Arial,sans-serif" font-size="15">Same shopping task, two interface variants</text>
  <rect x="48" y="112" width="530" height="342" rx="16" fill="#fff" stroke="#e8ecf2"/>
  <rect x="622" y="112" width="530" height="342" rx="16" fill="#fff" stroke="#d9e2ff"/>
  <rect x="72" y="136" width="34" height="34" rx="9" fill="#7c4d11"/>
  <text x="84" y="159" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">A</text>
  <text x="120" y="159" fill="#19212f" font-family="Arial,sans-serif" font-size="19" font-weight="700">Original — MarketCart</text>
  <rect x="646" y="136" width="34" height="34" rx="9" fill="#315efb"/>
  <text x="658" y="159" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">B</text>
  <text x="694" y="159" fill="#19212f" font-family="Arial,sans-serif" font-size="19" font-weight="700">Improved — MarketCart</text>

  <g font-family="Arial,sans-serif">
