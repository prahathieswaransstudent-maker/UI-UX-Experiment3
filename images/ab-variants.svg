    <rect x="232" y="325" width="150" height="96" rx="8" fill="#fff" stroke="#e8ecf2"/>
    <rect x="240" y="333" width="134" height="35" rx="5" fill="#fff4df"/>
    <text x="252" y="357" fill="#9a5a21" font-size="22">◷</text>
    <text x="242" y="386" fill="#19212f" font-size="11" font-weight="700">Smart Watch</text>
    <text x="242" y="403" fill="#e28a00" font-size="11">★ 4.5  ₹2,499</text>
    <rect x="392" y="325" width="150" height="96" rx="8" fill="#fff" stroke="#e8ecf2"/>
    <rect x="400" y="333" width="134" height="35" rx="5" fill="#eaf7f3"/>
    <text x="412" y="357" fill="#147d64" font-size="22">◒</text>
