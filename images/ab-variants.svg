    <rect x="814" y="333" width="134" height="35" rx="5" fill="#fff4df"/>
    <text x="826" y="357" fill="#9a5a21" font-size="22">◷</text>
    <text x="816" y="386" fill="#19212f" font-size="11" font-weight="700">Smart Watch</text>
    <text x="816" y="403" fill="#e28a00" font-size="11">★ 4.5  ₹2,499</text>
    <rect x="966" y="325" width="150" height="96" rx="8" fill="#fff" stroke="#e8ecf2"/>
    <rect x="974" y="333" width="134" height="35" rx="5" fill="#eaf7f3"/>
    <text x="986" y="357" fill="#147d64" font-size="22">◒</text>
    <text x="976" y="386" fill="#19212f" font-size="11" font-weight="700">Portable Speaker</text>
